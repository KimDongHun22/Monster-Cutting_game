<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>사각사각 몬스터</title>
<style>
:root{
  --bg-deep:#120821;
  --bg-deep-2:#1a0e2b;
  --panel:#1f1233;
  --panel-2:#2a1846;
  --line:#3c2a5c;
  --text-light:#f1e9fb;
  --text-dim:#b7a3d6;
  --accent-glow:#9ce66b;
  --accent-glow-2:#c6ff8f;
  --blood:#c23553;
  --gold:#f0c869;
  --gold-2:#ffe4a3;
  --fire:#ff7a2e;

  --zombie-1:#8bc34a;   --zombie-2:#4f7a26;
  --dracula-1:#8146c9;  --dracula-2:#341a54;
  --mummy-1:#e3cca0;    --mummy-2:#b89665;
  --frank-1:#9fc2a0;    --frank-2:#4d6b52;
  --witch-1:#7c4fae;    --witch-2:#2c1743;
  --princess-1:#fff2cf; --princess-2:#ffb3d6;
}

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

html,body{
  margin:0; padding:0; height:100%; overflow:hidden;
  background:
    radial-gradient(ellipse at 50% -10%, #2a1848 0%, transparent 55%),
    radial-gradient(ellipse at 90% 100%, #24123c 0%, transparent 50%),
    var(--bg-deep);
  color:var(--text-light);
  font-family:'Baloo 2','Nunito',system-ui,sans-serif;
  touch-action:none;
  overscroll-behavior:none;
}

@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Baloo+2:wght@500;600;700;800&display=swap');

#app{
  position:relative; width:100%; height:100%;
  max-width:480px; margin:0 auto;
  display:flex; flex-direction:column;
  overflow:hidden;
}

#app::before{
  content:''; position:absolute; inset:0; pointer-events:none; z-index:0;
  background-image:
    radial-gradient(2px 2px at 20% 30%, rgba(255,255,255,.15), transparent),
    radial-gradient(2px 2px at 70% 65%, rgba(255,255,255,.1), transparent),
    radial-gradient(1.5px 1.5px at 40% 80%, rgba(255,255,255,.12), transparent),
    radial-gradient(1.5px 1.5px at 85% 20%, rgba(255,255,255,.1), transparent);
}

#mute-btn{
  position:absolute; top:10px; right:10px; z-index:100;
  width:48px; height:48px; border-radius:50%;
  background:rgba(20,10,35,.75); border:1.5px solid var(--line);
  color:var(--text-light); font-size:24px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 4px 10px rgba(0,0,0,.4);
}

.screen{
  position:absolute; inset:0; z-index:5;
  display:none; flex-direction:column; align-items:center; justify-content:center;
  padding:32px 24px; text-align:center; overflow-y:auto;
  background:
    radial-gradient(ellipse at 50% 20%, rgba(140,80,220,.18), transparent 60%),
    var(--bg-deep);
}
.screen.active{ display:flex; }

.game-title{
  font-family:'Cinzel', serif; font-weight:800;
  font-size:clamp(28px,8vw,40px);
  letter-spacing:1px;
  color:var(--gold);
  text-shadow: 0 0 18px rgba(240,200,105,.55), 0 2px 0 #6b3a1a;
  margin:0 0 6px;
}
.game-subtitle{
  font-family:'Cinzel', serif; font-weight:600;
  font-size:clamp(15px,4.4vw,19px);
  color:var(--accent-glow-2);
  text-shadow:0 0 10px rgba(156,230,107,.5);
  margin:0 0 22px;
}
.flavor-text{
  color:var(--text-dim); font-size:14px; line-height:1.6;
  max-width:320px; margin:0 0 26px;
}
.flavor-text b{ color:var(--gold-2); }

.emoji-hero{ font-size:60px; margin-bottom:8px; filter:drop-shadow(0 8px 18px rgba(0,0,0,.5)); }

.btn-primary{
  font-family:'Baloo 2',sans-serif; font-weight:800; font-size:18px;
  color:#1a0e2b; background:linear-gradient(160deg, var(--accent-glow-2), var(--accent-glow));
  border:none; border-radius:999px; padding:15px 38px;
  box-shadow:0 6px 0 #4f7a26, 0 10px 22px rgba(0,0,0,.45);
  cursor:pointer; letter-spacing:.5px;
  transition:transform .12s ease, box-shadow .12s ease;
}
.btn-primary:active{ transform:translateY(4px); box-shadow:0 2px 0 #4f7a26, 0 4px 10px rgba(0,0,0,.4); }

.btn-secondary{
  margin-top:12px; background:transparent; border:1.5px solid var(--line);
  color:var(--text-dim); font-family:'Baloo 2',sans-serif; font-weight:600;
  border-radius:999px; padding:10px 22px; font-size:14px; cursor:pointer;
}

#game-screen{ position:relative; padding:14px 14px 10px; z-index:1; display:none; flex-direction:column; }
#game-screen.active{ display:flex; }

/* 안내판(HUD와 게임 보드 사이 고정 배치): 게임판을 가리지 않으면서도
   플레이 중 눈에 잘 띄도록 글자를 크고 굵게 키움 */
#guide-bubble{
  position:relative; z-index:3; margin-bottom:9px;
  background:rgba(15,7,28,.92);
  border:1.5px solid var(--gold); border-radius:14px;
  padding:10px 14px; box-shadow:0 6px 16px rgba(0,0,0,.4), 0 0 14px rgba(240,200,105,.2);
  font-size:15.5px; font-weight:700; line-height:1.4; color:var(--text-light); text-align:center;
}
#guide-bubble.pulse{ animation:guide-pulse .4s ease-out; }
@keyframes guide-pulse{
  0%{ transform:scale(.94); box-shadow:0 0 0 3px rgba(156,230,107,.55), 0 6px 16px rgba(0,0,0,.4); }
  100%{ transform:scale(1); box-shadow:0 6px 16px rgba(0,0,0,.4), 0 0 14px rgba(240,200,105,.2); }
}

#hud{ display:flex; align-items:center; gap:10px; margin-bottom:10px; z-index:2; }
.hud-badge{
  background:var(--panel); border:1px solid var(--line); border-radius:14px;
  padding:6px 12px; display:flex; flex-direction:column; align-items:flex-start; min-width:56px;
}
.hud-badge .label{ font-size:10px; color:var(--text-dim); letter-spacing:.5px; }
.hud-badge .value{ font-family:'Cinzel',serif; font-weight:700; font-size:17px; color:var(--gold-2); }

#timer-wrap{
  flex:1; height:18px; background:var(--panel); border:1px solid var(--line);
  border-radius:999px; overflow:hidden; position:relative;
}
#timer-fill{
  height:100%; width:100%; border-radius:999px;
  background:linear-gradient(90deg, var(--accent-glow), var(--accent-glow-2));
  transition:width .12s linear, background .3s ease;
  box-shadow:0 0 12px rgba(156,230,107,.6);
}
#timer-label{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  font-size:10.5px; font-weight:700; color:#1a0e2b; letter-spacing:.5px;
}

#board-wrap{
  position:relative; width:100%; aspect-ratio:1/1;
  background:linear-gradient(160deg, var(--panel-2), var(--bg-deep-2));
  border:2px solid var(--line); border-radius:18px;
  box-shadow:inset 0 0 40px rgba(0,0,0,.55), 0 10px 30px rgba(0,0,0,.5);
  overflow:hidden; margin:0 auto; touch-action:none;
}
#board{ position:absolute; inset:8px; }

#board-wrap::before{
  content:''; position:absolute; inset:0; pointer-events:none; z-index:0;
  background-image:
    repeating-linear-gradient(90deg, rgba(255,255,255,.03) 0 1px, transparent 1px calc(100%/7)),
    repeating-linear-gradient(0deg, rgba(255,255,255,.03) 0 1px, transparent 1px calc(100%/7));
}

#particle-layer{ position:absolute; inset:0; z-index:6; pointer-events:none; overflow:visible; }

#toast{
  position:absolute; top:70px; left:50%; transform:translate(-50%,-14px);
  background:rgba(20,10,35,.92); border:1px solid var(--gold);
  color:var(--gold-2); font-weight:700; font-size:13.5px;
  padding:10px 20px; border-radius:999px; white-space:nowrap;
  opacity:0; pointer-events:none; z-index:20;
  box-shadow:0 8px 20px rgba(0,0,0,.5);
  transition:opacity .25s ease, transform .25s ease;
}
#toast.show{ opacity:1; transform:translate(-50%,0); }

.block{
  position:absolute; border-radius:15px;
  display:flex; align-items:center; justify-content:center;
  box-shadow:inset 0 -5px 0 rgba(0,0,0,.22), inset 0 3px 0 rgba(255,255,255,.12), 0 4px 8px rgba(0,0,0,.4);
  transition:top .3s cubic-bezier(.34,1.56,.64,1), left .3s cubic-bezier(.34,1.56,.64,1), transform .16s ease, opacity .18s ease, box-shadow .15s ease;
  cursor:pointer; user-select:none; z-index:1;
  overflow:visible;
}
.block.picked{
  box-shadow:0 0 0 3px rgba(255,255,255,.55), 0 0 16px rgba(255,255,255,.45), inset 0 -5px 0 rgba(0,0,0,.22);
  transform:scale(1.08);
  z-index:4;
}
.block.invalid-shake{ animation:invalid-shake .38s ease; z-index:4; }
@keyframes invalid-shake{
  0%,100%{ transform:translateX(0) scale(1); }
  20%{ transform:translateX(-9px) rotate(-5deg); }
  40%{ transform:translateX(8px) rotate(5deg); }
  60%{ transform:translateX(-6px) rotate(-3deg); }
  80%{ transform:translateX(5px) rotate(3deg); }
}
.block.destroying{ animation:destroy-pop .22s ease-in forwards; z-index:5; }
.block.rescued{ animation:rescue-rise .42s ease-out forwards; z-index:8; }
.block.hurt{ animation:hurt-flash .35s ease-out; }
@keyframes hurt-flash{
  0%{ filter:brightness(1); }
  30%{ filter:brightness(2) saturate(0); }
  100%{ filter:brightness(1); }
}
@keyframes destroy-pop{
  0%{ transform:scale(1) rotate(0); opacity:1; }
  55%{ transform:scale(1.25) rotate(10deg); opacity:.85; }
  100%{ transform:scale(0.05) rotate(30deg); opacity:0; }
}
@keyframes rescue-rise{
  0%{ transform:translateY(0) scale(1) rotate(0deg); opacity:1; filter:brightness(1); }
  40%{ transform:translateY(-20px) scale(1.5) rotate(-8deg); opacity:1; filter:brightness(1.8); }
  100%{ transform:translateY(-90px) scale(1.9) rotate(10deg); opacity:0; filter:brightness(2.2); }
}

.face{ position:relative; width:58%; height:46%; margin-top:6%; }
/* 몬스터 계열은 눈/입뿐 아니라 몸 전체(얼굴 파트)가 살짝 좌우로 까딱거림 -> 순간적으로 헷갈리게 */
.block:not(.princess) .face{ animation: body-wobble 2.3s ease-in-out infinite; }
@keyframes body-wobble{
  0%,100%{ transform:translateX(-3px) rotate(-3deg); }
  50%{ transform:translateX(3px) rotate(3deg); }
}
.eyes{ position:absolute; top:0; left:0; right:0; display:flex; justify-content:space-between; }
.eye{
  width:22%; aspect-ratio:1/1; border-radius:50%; background:#1a0e2b;
  animation:eye-roll 2.6s ease-in-out infinite;
}
.mouth{
  position:absolute; bottom:2%; left:22%; right:22%; height:18%;
  border-radius:0 0 10px 10px; background:#1a0e2b;
  animation:mouth-wiggle 1.9s ease-in-out infinite;
  transform-origin:center top;
}
@keyframes eye-roll{ 0%,100%{ transform:translateX(-15%);} 50%{ transform:translateX(15%);} }
@keyframes mouth-wiggle{ 0%,100%{ transform:scaleX(1) rotate(0deg);} 50%{ transform:scaleX(1.2) rotate(-6deg);} }

.block.zombie{ background:linear-gradient(160deg, var(--zombie-1), var(--zombie-2)); }
.block.zombie .eye{ background:#1a1a0e; box-shadow:0 0 4px #2e3b0e; }

.block.dracula{ background:linear-gradient(160deg, var(--dracula-1), var(--dracula-2)); }
.block.dracula .eye{ background:#ff3b5c; box-shadow:0 0 6px #ff3b5c; }
.block.dracula .face::after{
  content:''; position:absolute; bottom:-4%; left:34%; width:6%; height:16%;
  background:#fff; clip-path:polygon(0 0,100% 0,50% 100%);
  box-shadow:20px 0 0 0 #fff;
}
.block.dracula::before{
  content:''; position:absolute; top:2%; left:50%; transform:translateX(-50%);
  width:0; height:0; border-left:16px solid transparent; border-right:16px solid transparent;
  border-top:10px solid #1a0e2b; opacity:.85;
}

.block.mummy{ background: repeating-linear-gradient(115deg, var(--mummy-1) 0 9px, var(--mummy-2) 9px 18px); }
.block.mummy .face{ height:30%; }
.block.mummy .eye{ background:#3a2c1a; width:18%; }
.block.mummy .mouth{ display:none; }

.block.frank{ background:linear-gradient(160deg, var(--frank-1), var(--frank-2)); }
.block.frank .eye{ background:#22321f; }
.block.frank::before, .block.frank::after{
  content:''; position:absolute; top:46%; width:14%; aspect-ratio:1/1; border-radius:50%;
  background:#c7c7b8; box-shadow:0 0 4px rgba(0,0,0,.4);
}
.block.frank::before{ left:-4%; }
.block.frank::after{ right:-4%; }

.block.witch{ background:linear-gradient(160deg, var(--witch-1), var(--witch-2)); }
.block.witch .eye{ background:#0d0616; box-shadow:0 0 6px #b58cf0; }
.block.witch::before{
  content:''; position:absolute; top:-30%; left:50%; transform:translateX(-50%);
  width:0; height:0; border-left:15px solid transparent; border-right:15px solid transparent;
  border-bottom:26px solid var(--witch-2);
}

.block.princess{
  background:linear-gradient(160deg, var(--princess-1), var(--princess-2));
  border-radius:50% 50% 28% 28% / 60% 60% 22% 22%;
  animation:princess-glow 1.7s ease-in-out infinite;
}
@keyframes princess-glow{
  0%,100%{ box-shadow:inset 0 -5px 0 rgba(0,0,0,.12), inset 0 3px 0 rgba(255,255,255,.4), 0 0 10px 2px rgba(255,214,140,.55), 0 4px 10px rgba(0,0,0,.4); }
  50%{ box-shadow:inset 0 -5px 0 rgba(0,0,0,.12), inset 0 3px 0 rgba(255,255,255,.4), 0 0 26px 9px rgba(255,214,140,.95), 0 4px 10px rgba(0,0,0,.4); }
}
.block.princess .face{ margin-top:26%; height:36%; }
.block.princess .eye{ background:#5c3a1a; animation:eye-sparkle 1.6s ease-in-out infinite; }
.block.princess .mouth{ width:22%; height:10%; border-radius:50%; background:#e88; opacity:.7; }
/* 볼터치: 좀 더 공주답게 보이도록 */
.block.princess .face::before, .block.princess .face::after{
  content:''; position:absolute; bottom:2%; width:15%; aspect-ratio:1/1; border-radius:50%;
  background:rgba(255,130,165,.55); filter:blur(1px);
}
.block.princess .face::before{ left:-10%; }
.block.princess .face::after{ right:-10%; }
@keyframes eye-sparkle{ 0%,100%{ box-shadow:0 0 0 rgba(255,255,255,0);} 50%{ box-shadow:0 0 6px 2px rgba(255,255,255,.9);} }
/* 왕관: 블록 영역 안쪽 상단에 배치해서 보드 경계에 잘리지 않도록 함 */
.crown-emoji{
  position:absolute; top:3%; left:50%; transform:translateX(-50%);
  font-size:24px; line-height:1; filter:drop-shadow(0 2px 4px rgba(0,0,0,.55)) drop-shadow(0 0 6px rgba(255,214,140,.8));
  animation:crown-bob 1.4s ease-in-out infinite; z-index:2;
}
@keyframes crown-bob{ 0%,100%{ transform:translateX(-50%) translateY(0) rotate(-4deg);} 50%{ transform:translateX(-50%) translateY(-2px) rotate(4deg);} }
.sparkle{
  position:absolute; width:8px; height:8px; background:var(--gold-2);
  clip-path:polygon(50% 0%,63% 38%,100% 50%,63% 62%,50% 100%,37% 62%,0 50%,37% 38%);
  animation:twinkle 1.4s ease-in-out infinite;
}
.sparkle.s1{ top:6%; left:8%; animation-delay:0s; }
.sparkle.s2{ top:14%; right:6%; animation-delay:.4s; }
.sparkle.s3{ bottom:16%; left:14%; animation-delay:.8s; }
@keyframes twinkle{ 0%,100%{ opacity:.25; transform:scale(.5);} 50%{ opacity:1; transform:scale(1.15);} }
.tear{
  position:absolute; bottom:22%; left:30%; width:6px; height:9px; border-radius:50% 50% 50% 0;
  background:#6bb7ff; transform:rotate(45deg); opacity:0; animation:tear-drip 2.8s ease-in infinite;
}
@keyframes tear-drip{
  0%{ opacity:0; transform:translateY(0) rotate(45deg);}
  10%{ opacity:.85;}
  70%{ opacity:.6; transform:translateY(11px) rotate(45deg);}
  100%{ opacity:0; transform:translateY(14px) rotate(45deg);}
}

.particle{ position:absolute; pointer-events:none; will-change:transform,opacity; margin:-8px 0 0 -8px; }
.particle.bone{
  width:5px; height:14px; background:linear-gradient(#fffef6,#f0e6cc); border-radius:2px;
  box-shadow:0 0 4px rgba(0,0,0,.45);
  animation:particle-fly .68s cubic-bezier(.22,.75,.28,1) forwards;
}
/* 뼈다귀 양 끝의 동그란 관절 부분(::before/::after)으로 진짜 뼈 모양을 표현 */
.particle.bone::before, .particle.bone::after{
  content:''; position:absolute; left:50%; width:9px; height:9px; border-radius:50%;
  background:inherit; transform:translateX(-50%); box-shadow:0 0 3px rgba(0,0,0,.4);
}
.particle.bone::before{ top:-4.5px; }
.particle.bone::after{ bottom:-4.5px; }
.particle.fire{
  width:12px; height:12px; border-radius:50%;
  background:radial-gradient(circle, #ffe08a, #ff7a2e 60%, transparent 75%);
  animation:particle-fly .55s ease-out forwards;
}
.particle.ash{
  width:6px; height:6px; border-radius:50%;
  background:radial-gradient(circle, #8a8a8a, #2c2c2c 70%, transparent 90%);
  animation:particle-fly .95s ease-out forwards;
}
.particle.spark{
  width:4px; height:16px; background:linear-gradient(#fff8c9, #ffcf3b); border-radius:2px;
  animation:particle-fly .5s ease-out forwards;
}
.particle.gold{
  width:8px; height:8px; background:var(--gold-2);
  clip-path:polygon(50% 0%,63% 38%,100% 50%,63% 62%,50% 100%,37% 62%,0 50%,37% 38%);
  animation:particle-fly .75s ease-out forwards;
}
@keyframes particle-fly{
  0%{ transform:translate(0,0) scale(1) rotate(0deg); opacity:1; }
  42%{ transform:translate(var(--tx-mid),var(--ty-mid)) scale(calc(var(--scale) * 1.05)) rotate(calc(var(--rot) * .5)); opacity:1; }
  100%{ transform:translate(var(--tx),var(--ty)) scale(calc(var(--scale) * .12)) rotate(var(--rot)); opacity:0; }
}

/* 화염방사기: 몬스터가 불타서 재가 되어 사라지는 연출 */
.block.burning{ animation:burn-away .6s ease-in forwards; z-index:6; }
@keyframes burn-away{
  0%{ filter:brightness(1) saturate(1); opacity:1; transform:scale(1) rotate(0deg); }
  35%{ filter:brightness(.65) saturate(.35) contrast(1.3); opacity:1; transform:scale(1.06) rotate(-3deg); }
  70%{ filter:brightness(.25) saturate(0) contrast(1.8); opacity:.65; transform:scale(.8) rotate(6deg); }
  100%{ filter:brightness(.05) saturate(0); opacity:0; transform:scale(.12) rotate(14deg); }
}

/* 콤보 팝업 */
.combo-popup{
  position:absolute; left:50%; top:36%; z-index:30; pointer-events:none;
  font-family:'Cinzel',serif; font-weight:800; text-align:center; white-space:nowrap;
  text-shadow:0 0 10px currentColor, 0 3px 6px rgba(0,0,0,.6);
  opacity:0; transform:translate(-50%,-50%) scale(.2) rotate(-12deg);
}
.combo-popup.show{ animation:combo-pop .8s cubic-bezier(.34,1.56,.64,1) forwards; }
.combo-sub{ font-family:'Baloo 2',sans-serif; font-size:14px; font-weight:700; margin-top:2px; color:var(--text-light); text-shadow:0 2px 4px rgba(0,0,0,.6); }
@keyframes combo-pop{
  0%{ opacity:0; transform:translate(-50%,-50%) scale(.2) rotate(-16deg); }
  22%{ opacity:1; transform:translate(-50%,-50%) scale(1.3) rotate(7deg); }
  45%{ opacity:1; transform:translate(-50%,-52%) scale(1) rotate(-3deg); }
  75%{ opacity:1; transform:translate(-50%,-62%) scale(1.05) rotate(0deg); }
  100%{ opacity:0; transform:translate(-50%,-85%) scale(.92) rotate(0deg); }
}
#board-wrap.shake{ animation:board-shake .35s ease; }
@keyframes board-shake{
  0%,100%{ transform:translate(0,0); }
  20%{ transform:translate(-5px,3px); }
  40%{ transform:translate(5px,-3px); }
  60%{ transform:translate(-4px,-2px); }
  80%{ transform:translate(4px,2px); }
}

.shockwave{
  position:absolute; width:12px; height:12px; margin:-6px 0 0 -6px; border-radius:50%;
  border:3px solid rgba(255,255,255,.85); pointer-events:none;
  animation:shockwave-pop .38s ease-out forwards;
}
.shockwave.fire{ border-color:rgba(255,140,50,.9); }
.shockwave.spark{ border-color:rgba(255,220,80,.9); }
.shockwave.gold{ border-color:rgba(255,225,150,.95); }
@keyframes shockwave-pop{ 0%{ transform:scale(.2); opacity:.9;} 100%{ transform:scale(3.6); opacity:0;} }

/* 화염방사기 조준 시 보드 테두리 강조 */
#board-wrap.targeting{ box-shadow:inset 0 0 0 3px var(--fire), 0 0 24px rgba(255,122,46,.6); }

/* 공주 구출 성공 시 보드 전체를 훑는 골드 플래시 */
#rescue-flash{
  position:absolute; inset:0; z-index:9; pointer-events:none; opacity:0;
  background:radial-gradient(circle, rgba(255,232,170,.95), rgba(255,214,140,.35) 45%, rgba(255,214,140,0) 72%);
}
#rescue-flash.show{ animation:rescue-flash-pop .7s ease-out forwards; }
@keyframes rescue-flash-pop{
  0%{ opacity:0; transform:scale(.25); }
  30%{ opacity:1; transform:scale(1.05); }
  100%{ opacity:0; transform:scale(1.6); }
}

/* 공주가 매치에 휘말렸을 때: 게임을 끝내지 않고 화면을 잠깐 가리는 벌칙 연출 */
#princess-hurt-overlay{
  position:absolute; inset:0; z-index:60;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:rgba(10,4,22,.86);
  opacity:0; pointer-events:none; transition:opacity .2s ease;
}
#princess-hurt-overlay.show{ opacity:1; pointer-events:auto; }
.hurt-crown{ font-size:64px; animation:hurt-shake .45s ease-in-out infinite; filter:drop-shadow(0 0 20px rgba(255,180,210,.7)); }
.hurt-face{ font-size:80px; margin-top:-6px; animation:hurt-shake .45s ease-in-out infinite reverse; }
@keyframes hurt-shake{
  0%,100%{ transform:rotate(-7deg) translateX(-4px); }
  50%{ transform:rotate(7deg) translateX(4px); }
}
.hurt-text{
  margin-top:10px; font-family:'Cinzel',serif; font-weight:700; font-size:16px;
  color:var(--gold-2); text-shadow:0 0 10px rgba(240,200,105,.6); text-align:center;
}
.hurt-tears{ display:flex; gap:14px; margin-top:8px; }
.hurt-tears span{ font-size:20px; animation:tear-fall 1s ease-in infinite; opacity:0; }
.hurt-tears span:nth-child(2){ animation-delay:.25s; }
.hurt-tears span:nth-child(3){ animation-delay:.5s; }
@keyframes tear-fall{
  0%{ transform:translateY(-4px); opacity:0; }
  25%{ opacity:1; }
  100%{ transform:translateY(24px); opacity:0; }
}

/* 공주 구출 성공 연출: 공주가 크게 나타나 하트를 날려줌 */
#rescue-kiss-overlay{
  position:absolute; inset:0; z-index:60;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:radial-gradient(circle, rgba(255,214,140,.28), rgba(10,4,22,.88) 70%);
  opacity:0; pointer-events:none; transition:opacity .25s ease;
}
#rescue-kiss-overlay.show{ opacity:1; animation:kiss-overlay-pop .5s ease-out; }
@keyframes kiss-overlay-pop{
  0%{ transform:scale(.8); }
  50%{ transform:scale(1.05); }
  100%{ transform:scale(1); }
}
.kiss-crown{ font-size:64px; animation:crown-bob 1s ease-in-out infinite; filter:drop-shadow(0 0 20px rgba(255,214,140,.8)); }
.kiss-face{ font-size:84px; margin-top:-6px; animation:kiss-bounce .6s ease-in-out infinite; }
@keyframes kiss-bounce{
  0%,100%{ transform:scale(1) rotate(-4deg); }
  50%{ transform:scale(1.1) rotate(4deg); }
}
.kiss-text{
  margin-top:10px; font-family:'Cinzel',serif; font-weight:700; font-size:17px;
  color:var(--gold-2); text-shadow:0 0 12px rgba(240,200,105,.7); text-align:center;
}
.kiss-hearts{ position:absolute; inset:0; overflow:hidden; pointer-events:none; }
.kiss-hearts span{
  position:absolute; bottom:38%; font-size:26px; opacity:0;
  animation:heart-fly 1.3s ease-out infinite;
}
.kiss-hearts span:nth-child(1){ left:32%; animation-delay:0s; }
.kiss-hearts span:nth-child(2){ left:48%; animation-delay:.2s; }
.kiss-hearts span:nth-child(3){ left:58%; animation-delay:.4s; }
.kiss-hearts span:nth-child(4){ left:42%; animation-delay:.6s; }
@keyframes heart-fly{
  0%{ transform:translateY(0) scale(.4) rotate(-8deg); opacity:0; }
  15%{ opacity:1; }
  100%{ transform:translateY(-160px) scale(1.15) rotate(10deg); opacity:0; }
}

/* 새 무기 해금: 큰 아이콘이 화면 중앙에서 무기 슬롯 자리로 날아가는 연출 */
.weapon-unlock-fly{
  position:fixed; z-index:200; left:0; top:0;
  font-size:74px; line-height:1;
  transform:translate(-50%,-50%) scale(1) rotate(0deg);
  filter:drop-shadow(0 0 22px rgba(255,255,255,.85));
  pointer-events:none;
}
.weapon-unlock-fly.fly{
  transition:transform .95s cubic-bezier(.28,.85,.25,1), font-size .95s ease;
  transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(.3) rotate(360deg);
}
.weapon-slot.just-unlocked{ animation:slot-pop .6s ease-out; }
@keyframes slot-pop{
  0%{ transform:scale(1.55); box-shadow:0 0 0 4px var(--gold), 0 0 34px 10px rgba(240,200,105,.9); }
  100%{ transform:scale(1); }
}

#weapon-bar{ display:flex; gap:10px; margin-top:10px; z-index:2; }
.weapon-slot{
  flex:1; position:relative; background:var(--panel); border:1.5px solid var(--line);
  border-radius:14px; padding:8px 4px 7px; display:flex; flex-direction:column;
  align-items:center; gap:2px; cursor:pointer;
  transition:transform .12s ease, border-color .15s ease, box-shadow .15s ease;
}
.weapon-slot .icon{ font-size:22px; filter:drop-shadow(0 2px 3px rgba(0,0,0,.5)); }
.weapon-slot .name{ font-size:11px; color:var(--text-dim); font-weight:700; }
.weapon-slot.active{
  border-color:var(--accent-glow-2);
  box-shadow:0 0 0 2px rgba(156,230,107,.35), 0 0 14px rgba(156,230,107,.4);
  transform:translateY(-2px);
}
.weapon-slot.active .name{ color:var(--accent-glow-2); }
.weapon-slot.locked{ opacity:.42; filter:grayscale(.6); cursor:not-allowed; }
.weapon-slot.locked .lock{ position:absolute; top:4px; right:6px; font-size:11px; }
.weapon-slot.arming{ animation:arm-pulse .9s ease-in-out infinite; border-color:var(--fire); }
@keyframes arm-pulse{ 0%,100%{ box-shadow:0 0 0 2px rgba(255,122,46,.4);} 50%{ box-shadow:0 0 15px 5px rgba(255,122,46,.85);} }
.weapon-slot.cooling{ opacity:.5; cursor:not-allowed; }
.weapon-slot.cooling .name{ color:var(--text-dim); }

/* 현재 선택된(또는 조준 중인) 무기의 설명 */
#weapon-desc{
  margin-top:8px; background:var(--panel); border:1px solid var(--line); border-radius:12px;
  padding:10px 14px; font-size:14.5px; line-height:1.55; color:var(--text-light); text-align:center;
}
#weapon-desc b{ color:var(--gold-2); font-size:15px; }

#gameover-screen .emoji-hero{ font-size:52px; }
#final-score{
  font-family:'Cinzel',serif; font-weight:800; font-size:38px; color:var(--gold-2);
  text-shadow:0 0 16px rgba(240,200,105,.5); margin:4px 0 14px;
}
#gameover-reason{ color:var(--text-dim); font-size:14px; margin-bottom:2px; }

#ranking-panel{
  width:100%; max-width:280px; background:var(--panel); border:1px solid var(--line);
  border-radius:14px; padding:12px 14px; margin:4px 0 16px;
}
.ranking-title{ font-weight:800; font-size:13px; color:var(--gold-2); margin:0 0 8px; }
#ranking-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:5px; }
.rank-row{ display:flex; justify-content:space-between; font-size:13px; color:var(--text-dim); padding:4px 9px; border-radius:8px; background:rgba(255,255,255,.03); }
.rank-row.mine{ background:rgba(240,200,105,.18); border:1px solid var(--gold); color:var(--gold-2); font-weight:700; }
.rank-num{ font-weight:800; }
.rank-level{ font-size:11px; opacity:.75; font-weight:600; }
#my-rank{ margin:9px 0 0; font-size:12px; color:var(--text-dim); }

@media (max-width:360px){
  .hud-badge{ padding:5px 9px; min-width:46px; }
  .hud-badge .value{ font-size:15px; }
}

<body>
<div id="app">
  <button id="mute-btn" aria-label="소리 켜기/끄기">🔊</button>


  <div id="start-screen" class="screen active">
    <div class="emoji-hero">🏰🧟</div>
    <h1 class="game-title">사각사각 몬스터</h1>

    <p class="flavor-text">

      <b>👑 공주님</b>이 매치에 휘말리면 Power가 크게 줄어들어요.
      Power가 0이 되면 게임 오버, 맨 아래 줄까지 무사히 내려오면 구출 성공!

    </div>

    <div id="guide-bubble"><span id="guide-text">👑 공주가 몬스터들에게 갇혀있어요! 서둘러 구출해주세요.</span></div>

      <div class="hurt-face">😢</div>
      <div class="hurt-tears"><span>💧</span><span>💧</span><span>💧</span></div>
      <p class="hurt-text">앗! 공주님이 다쳤어요...</p>
    </div>

    <div id="rescue-kiss-overlay">
      <div class="kiss-crown">👑</div>
      <div class="kiss-face">😘</div>
      <div class="kiss-hearts"><span>💗</span><span>💕</span><span>💖</span><span>💗</span></div>
      <p class="kiss-text">공주님을 구출했어요!</p>
    </div>

  </div>

  <div id="gameover-screen" class="screen">
    <div class="emoji-hero">💀</div>

    <p id="gameover-reason">시간이 다 되었어요...</p>
    <div id="final-score">0</div>

    <div id="ranking-panel">
      <p class="ranking-title">🏆 명예의 전당 TOP 5</p>
      <ol id="ranking-list"></ol>
      <p id="my-rank"></p>
    </div>

    <button class="btn-primary" id="btn-restart">🔄 다시 도전하기</button>
    <button class="btn-secondary" id="btn-home">처음 화면으로</button>
  </div>

</div>

<script>
(function(){
  "use strict";

  /* ---------------- 상수 ---------------- */
  const ROWS = 7, COLS = 7;
  const ZOMBIE_TYPES = ['zombie','dracula','mummy','frank','witch'];
  const DIRS = [[-1,0],[1,0],[0,-1],[0,1]];
  const PRINCESS_CHANCE = 0.06;
  const MAX_PRINCESS_ON_BOARD = 2;

  const LEVEL_UP_SCORE = 550;              // 레벨업에 필요한 점수 (더 완만하게)
  const TIME_MAX = 100;
  const TIME_BASE_DEPLETION = 1.0;         // 초당 Power 감소량 (더욱 느리게)
  const TIME_DEPLETION_PER_LEVEL = 0.22;   // 레벨당 추가 감소량 (더욱 완만하게)
  const TIME_RESTORE_PER_BLOCK = 3.6;      // 몬스터를 자를 때마다 채워지는 Power (미세 하향 조정)
  const RESCUE_BONUS = 100;
  const PRINCESS_HURT_LOCK_MS = 1500;      // 공주가 다쳤을 때 화면을 가리는 시간(밀리초)
  const PRINCESS_HIT_PENALTY = 16;         // 공주가 다쳤을 때 추가로 깎이는 Power
  const RESCUE_KISS_VISIBLE_MS = 1300;     // 구출 연출(하트 날리기)이 화면에 보이는 시간
  const RESCUE_POWER_FREEZE_EXTRA_MS = 1000; // 연출이 끝난 뒤에도 Power를 추가로 묶어두는 시간

  const FLAME_RADIUS = 2;                  // 화염방사기 폭발 반경(체비셰프 거리)
  const FLAME_COOLDOWN_MS = 15000;         // 화염방사기 재사용 대기시간

  const RANKING_KEY = 'zombie_slash_rankings_v1';
  const RANKING_STORE_MAX = 30;
  const RANKING_DISPLAY_MAX = 5;

  const WEAPONS = [
    { id:'scythe',      name:'낫',       icon:'🔪', unlockLevel:1,  scoreMul:1.0 },
    { id:'sword',       name:'검',       icon:'⚔️', unlockLevel:11, scoreMul:1.0 },
    { id:'chainsaw',    name:'전기톱',    icon:'🪚', unlockLevel:21, scoreMul:1.5 },
    { id:'flamethrower',name:'화염방사기',icon:'🔥', unlockLevel:31 },
  ];

  const WEAPON_DESC = {
    scythe: '기본 무기예요. 몬스터들을 하나하나 정확히 찾아내어 잘라낼 수 있어요.',
    sword: '공격 범위가 늘어나요! 베어버린 줄에 있는 모든 몬스터를 한 번에 잘라낼 수 있어요.',
    chainsaw: '공격 범위가 십자(+) 모양으로 늘어나서, 많은 몬스터들을 한 번에 해치울 수 있어요.',
    flamethrower: '아주 넓은 범위의 몬스터를 한꺼번에 태워버리는 강력한 스킬이에요. 사용 중엔 공주님께 보호막이 생겨서 절대 다치지 않아요!'
  };

  const GUIDE_MESSAGES = {
    start: '👑 공주가 몬스터들에게 갇혀있어요! 서둘러 구출해주세요.',
    howto: '💡 블록을 밀어서 같은 색 3개 이상을 맞추면 사라져요!',
    princessSpawn: '✨ 공주님을 발견했어요! 맨 아래 줄까지 무사히 내려보내주세요.',
    rescued: '🎉 공주님을 구출했어요! Power가 가득 채워졌어요!',
    hurt: '😢 앗, 공주님이 다쳤어요... 매치할 때 조심해주세요.',
    lowPower: '⏰ Power가 얼마 안 남았어요! 서둘러 몬스터를 잘라주세요!',
    flamethrowerReady: '🔥 화염방사기 재사용 준비 완료! 강력한 한 방을 노려보세요.',
    weaponUnlocked: (name)=> '🗡️ 새로운 무기 "'+name+'"이(가) 열렸어요! 하단에서 사용해보세요.'
  };

  /* ---------------- 상태 ---------------- */
  let state = 'start';
  let board = [];
  let blocks = {};
  let blockIdSeq = 1;
  let cellSize = 0;

  let score = 0;
  let level = 1;
  let timePower = TIME_MAX;
  let currentWeaponId = 'scythe';           // 낫/검/전기톱 중 장착된 무기
  let flamethrowerState = { armed:false, cooldownLeft:0 };
  let lastCooldownSecRendered = -1;

  let dragStartBlockId = null;
  let dragStartClient = null;
  let dragResolved = false;
  let inputLocked = false; // 공주 피해 연출 중에는 입력을 잠깐 막는다
  let powerFreezeUntil = 0; // 이 시각까지는 Power가 깎이지 않고 고정된다 (공주 구출 직후)

  let rafId = null;
  let lastFrameTs = null;
  let memoryRankings = []; // localStorage 사용 불가 시 세션 내 임시 저장소
  let guideLockUntil = 0;         // 가이드 말풍선 우선순위 잠금 시각
  let lowPowerWarned = false;     // Power 부족 경고 중복 방지
  let prevFlameCooldownLeft = 0;  // 화염방사기 재충전 완료 감지용

  /* ---------------- DOM 참조 ---------------- */
  const $ = (sel)=>document.querySelector(sel);
  const startScreen   = $('#start-screen');
  const gameScreen     = $('#game-screen');
  const gameoverScreen = $('#gameover-screen');
  const boardWrap = $('#board-wrap');
  const boardEl   = $('#board');
  const particleLayer = $('#particle-layer');
  const weaponBarEl = $('#weapon-bar');
  const weaponDescEl = $('#weapon-desc');
  const hudLevel = $('#hud-level');
  const hudScore = $('#hud-score');
  const timerFill = $('#timer-fill');
  const toastEl = $('#toast');
  const princessHurtOverlay = $('#princess-hurt-overlay');
  const rescueKissOverlay = $('#rescue-kiss-overlay');
  const rescueFlashEl = $('#rescue-flash');
  const guideBubble = $('#guide-bubble');
  const guideTextEl = $('#guide-text');
  const muteBtn = $('#mute-btn');

  /* =====================================================================
     오디오 엔진: 외부 음원 파일 없이 Web Audio API로 배경음악/효과음을 직접 합성한다.
     (오프라인 단일 파일로 배포되므로 모든 사운드를 코드로 생성)
     ===================================================================== */
  let actx = null, masterGain = null, musicGain = null, sfxGain = null;
  let audioMuted = false;
  let musicToken = 0;
  let musicTimeoutId = null;
  let idleTauntTimer = null;

  function ensureAudio(){
    if(!actx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return null;
      actx = new AC();
      masterGain = actx.createGain(); masterGain.gain.value = audioMuted ? 0 : 1; masterGain.connect(actx.destination);
      musicGain = actx.createGain(); musicGain.gain.value = 0.5; musicGain.connect(masterGain);
      sfxGain = actx.createGain(); sfxGain.gain.value = 0.9; sfxGain.connect(masterGain);
    }
    if(actx.state === 'suspended') actx.resume();
    return actx;
  }

  function setAudioMuted(v){
    audioMuted = v;
    if(masterGain) masterGain.gain.setTargetAtTime(v?0:1, actx.currentTime, 0.05);
    if(muteBtn) muteBtn.textContent = v ? '🔇' : '🔊';
  }

  function noiseBuffer(duration){
    const c = ensureAudio(); if(!c) return null;
    const size = Math.max(1, Math.floor(c.sampleRate*duration));
    const buf = c.createBuffer(1, size, c.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<size;i++) d[i] = Math.random()*2-1;
    return buf;
  }

  // 순수 오실레이터 톤(비명, 효과음, 멜로디에 사용)
  function tone(o){
    const c = ensureAudio(); if(!c) return;
    const t0 = c.currentTime + (o.delay||0);
    const osc = c.createOscillator();
    const g = c.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(o.freq, t0);
    if(o.freqEnd) osc.frequency.exponentialRampToValueAtTime(Math.max(o.freqEnd,1), t0+o.dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(o.gain||0.2, t0+0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+o.dur);
    osc.connect(g); g.connect(o.bus||sfxGain);
    osc.start(t0); osc.stop(t0+o.dur+0.03);
  }

  // 필터링된 화이트노이즈 버스트(타격음, 바람소리, 지지직 소리 등에 사용)
  function noiseBurst(o){
    const c = ensureAudio(); if(!c) return;
    const t0 = c.currentTime + (o.delay||0);
    const src = c.createBufferSource();
    src.buffer = noiseBuffer(o.dur);
    const filt = c.createBiquadFilter();
    filt.type = o.filterType || 'bandpass';
    filt.frequency.setValueAtTime(o.freq, t0);
    if(o.freqEnd) filt.frequency.exponentialRampToValueAtTime(Math.max(o.freqEnd,50), t0+o.dur);
    filt.Q.value = o.q!==undefined ? o.q : 1;
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(o.gain||0.3, t0+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+o.dur);
    src.connect(filt); filt.connect(g); g.connect(o.bus||sfxGain);
    src.start(t0); src.stop(t0+o.dur+0.03);
  }

  function stopMusic(){
    musicToken++;
    if(musicTimeoutId){ clearTimeout(musicTimeoutId); musicTimeoutId=null; }
  }
  function playMusic(track, loop){
    const c = ensureAudio(); if(!c) return;
    stopMusic();
    const myToken = musicToken;
    const beatSec = 60/track.tempo;
    let i = 0;
    (function step(){
      if(myToken !== musicToken) return;
      const note = track.notes[i];
      const dur = note[1]*beatSec*0.92;
      if(note[0]>0){
        tone({type:track.type, freq:note[0], dur, gain:0.11, bus:musicGain});
        tone({type:'sine', freq:note[0]/2, dur:dur*0.9, gain:0.045, bus:musicGain});
      }
      i++;
      if(i>=track.notes.length){
        if(loop) i=0; else return;
      }
      musicTimeoutId = setTimeout(step, note[1]*beatSec*1000);
    })();
  }

  /* ---------------- 랭킹(localStorage, 실패 시 세션 메모리로 대체) ---------------- */
  function loadRankings(){
    try{
      const raw = localStorage.getItem(RANKING_KEY);
      return raw ? JSON.parse(raw) : [];
    }catch(e){ return memoryRankings.slice(); }
  }
  function saveRankings(list){
    try{ localStorage.setItem(RANKING_KEY, JSON.stringify(list)); }
    catch(e){ memoryRankings = list; }
  }
  function submitScore(newScore, newLevel){
    const list = loadRankings();
    const entry = { score:newScore, level:newLevel, ts:Date.now() };
    list.push(entry);
    list.sort((a,b)=> b.score - a.score || a.ts - b.ts);
    const rank = list.indexOf(entry) + 1;
    const trimmed = list.slice(0, RANKING_STORE_MAX);
    saveRankings(trimmed);
    return { top: trimmed.slice(0, RANKING_DISPLAY_MAX), rank, totalCount:list.length, entry };
  }

  /* ---------------- 보드 데이터 모델 & 렌더링 ---------------- */
  function createBlock(type, row, col, spawnAboveOffset){
    const id = 'b' + (blockIdSeq++);
    const el = document.createElement('div');
    el.className = 'block ' + type;
    el.dataset.id = id;

    if(type !== 'princess'){
      el.innerHTML = '<div class="face"><div class="eyes"><span class="eye"></span><span class="eye"></span></div><div class="mouth"></div></div>';
    } else {
      el.innerHTML =
        '<span class="crown-emoji">👑</span>' +
        '<div class="face"><div class="eyes"><span class="eye"></span><span class="eye"></span></div><div class="mouth"></div></div>' +
        '<span class="sparkle s1"></span><span class="sparkle s2"></span><span class="sparkle s3"></span>' +
        '<span class="tear"></span>';
    }

    // 애니메이션 지연을 랜덤화해서 블록마다 조금씩 다르게 움직이도록 함
    const faceEl = el.querySelector('.face');
    if(faceEl) faceEl.style.animationDelay = (-Math.random()*2.3).toFixed(2)+'s';
    el.querySelectorAll('.eye').forEach(e=> e.style.animationDelay = (-Math.random()*2.6).toFixed(2)+'s');
    const mouthEl = el.querySelector('.mouth');
    if(mouthEl) mouthEl.style.animationDelay = (-Math.random()*1.9).toFixed(2)+'s';

    boardEl.appendChild(el);
    const block = { id, type, row, col, el };
    blocks[id] = block;
    positionBlock(block, spawnAboveOffset);
    return block;
  }

  function positionBlock(block, spawnAboveOffset){
    const gap = 4;
    const size = cellSize - gap;
    block.el.style.width = size + 'px';
    block.el.style.height = size + 'px';
    block.el.style.left = (block.col * cellSize + gap/2) + 'px';

    if(spawnAboveOffset !== undefined){
      block.el.style.transition = 'none';
      block.el.style.top = ((block.row - spawnAboveOffset) * cellSize + gap/2) + 'px';
      void block.el.offsetHeight;
      requestAnimationFrame(()=>{
        block.el.style.transition = '';
        block.el.style.top = (block.row * cellSize + gap/2) + 'px';
      });
    } else {
      block.el.style.top = (block.row * cellSize + gap/2) + 'px';
    }
  }

  function recalcCellSize(){
    cellSize = boardEl.clientWidth / COLS;
    for(const id in blocks) positionBlock(blocks[id]);
  }

  function buildInitialBoard(){
    board = Array.from({length:ROWS}, ()=>Array(COLS).fill(null));
    for(let r=0;r<ROWS;r++){
      for(let c=0;c<COLS;c++){
        let type;
        let guard = 0;
        do{
          type = randomZombieType();
          guard++;
        } while(guard<30 && (
          (c>=2 && board[r][c-1] && board[r][c-2] && blocks[board[r][c-1]].type===type && blocks[board[r][c-2]].type===type) ||
          (r>=2 && board[r-1][c] && board[r-2][c] && blocks[board[r-1][c]].type===type && blocks[board[r-2][c]].type===type)
        ));
        const block = createBlock(type, r, c);
        board[r][c] = block.id;
      }
    }
    const pr = Math.floor(Math.random()*ROWS);
    const pc = Math.floor(Math.random()*COLS);
    const oldId = board[pr][pc];
    if(oldId){ blocks[oldId].el.remove(); delete blocks[oldId]; }
    const princessBlock = createBlock('princess', pr, pc);
    board[pr][pc] = princessBlock.id;
  }

  function clearBoardDom(){ boardEl.innerHTML = ''; blocks = {}; board = []; }

  /* ---------------- 입력 처리 (스왑 드래그 + 화염방사기 조준) ---------------- */
  function blockUnderPoint(clientX, clientY){
    const el = document.elementFromPoint(clientX, clientY);
    if(!el) return null;
    const blockEl = el.closest('.block');
    if(!blockEl) return null;
    return blocks[blockEl.dataset.id] || null;
  }

  function onPointerDown(e){
    if(state !== 'playing' || inputLocked) return;

    // 화염방사기 조준 중이면: 탭한 블록을 중심으로 즉시 발사
    if(flamethrowerState.armed){
      const target = blockUnderPoint(e.clientX, e.clientY);
      if(target) triggerFlamethrower(target);
      return;
    }

    const block = blockUnderPoint(e.clientX, e.clientY);
    if(!block) return;
    dragStartBlockId = block.id;
    dragStartClient = { x:e.clientX, y:e.clientY };
    dragResolved = false;
    block.el.classList.add('picked');
  }

  function onPointerMove(e){
    if(!dragStartBlockId || dragResolved || state!=='playing') return;
    const dx = e.clientX - dragStartClient.x;
    const dy = e.clientY - dragStartClient.y;
    const threshold = cellSize * 0.32;
    if(Math.max(Math.abs(dx),Math.abs(dy)) < threshold) return;

    const a = blocks[dragStartBlockId];
    if(!a){ dragStartBlockId=null; return; }
    dragResolved = true;
    a.el.classList.remove('picked');

    let dr=0, dc=0;
    if(Math.abs(dx) > Math.abs(dy)) dc = dx>0 ? 1 : -1;
    else dr = dy>0 ? 1 : -1;

    const nr = a.row+dr, nc = a.col+dc;
    const startId = dragStartBlockId;
    dragStartBlockId = null;
    if(!inBounds(nr,nc)) return;
    const targetId = board[nr][nc];
    if(targetId) attemptSwap(startId, targetId);
  }

  function onPointerUp(){
    if(dragStartBlockId){
      const a = blocks[dragStartBlockId];
      if(a) a.el.classList.remove('picked');
    }
    dragStartBlockId = null;
    dragResolved = false;
  }

  /* ---------------- 스왑 & 매치 판정 ---------------- */
  function doSwapData(a,b){
    const tr=a.row, tc=a.col;
    a.row=b.row; a.col=b.col;
    b.row=tr; b.col=tc;
    board[a.row][a.col]=a.id;
    board[b.row][b.col]=b.id;
    positionBlock(a);
    positionBlock(b);
  }

  // 특정 좌표를 지나는 가로/세로 동일 타입 연속 구간(3개 이상)을 "런(run)" 형태로 반환
  function findRunsAt(row,col){
    const id = board[row] && board[row][col];
    if(!id || !blocks[id]) return [];
    const type = blocks[id].type;
    const runs = [];

    let left=col, right=col;
    while(left-1>=0 && board[row][left-1] && blocks[board[row][left-1]] && blocks[board[row][left-1]].type===type) left--;
    while(right+1<COLS && board[row][right+1] && blocks[board[row][right+1]] && blocks[board[row][right+1]].type===type) right++;
    if(right-left+1>=3) runs.push({axis:'row', row, start:left, end:right});

    let top=row, bottom=row;
    while(top-1>=0 && board[top-1][col] && blocks[board[top-1][col]] && blocks[board[top-1][col]].type===type) top--;
    while(bottom+1<ROWS && board[bottom+1][col] && blocks[board[bottom+1][col]] && blocks[board[bottom+1][col]].type===type) bottom++;
    if(bottom-top+1>=3) runs.push({axis:'col', col, start:top, end:bottom});

    return runs;
  }

  function combineRuns(posA, posB){
    const runsA = findRunsAt(posA.row,posA.col);
    const runsB = findRunsAt(posB.row,posB.col);
    const map = new Map();
    [...runsA, ...runsB].forEach(run=>{
      const key = run.axis+':'+(run.axis==='row'?run.row:run.col)+':'+run.start+':'+run.end;
      map.set(key, run);
    });
    return [...map.values()];
  }

  function runCells(run){
    const ids=[];
    if(run.axis==='row'){ for(let c=run.start;c<=run.end;c++) ids.push(board[run.row][c]); }
    else { for(let r=run.start;r<=run.end;r++) ids.push(board[r][run.col]); }
    return ids;
  }

  function baseMatchFromRuns(runs){
    const set = new Set();
    runs.forEach(run=> runCells(run).forEach(id=>{ if(id) set.add(id); }));
    return set;
  }

  // 검: 매치된 줄(가로 또는 세로) 전체를 일자로 베어버려 다른 색 블록도 함께 파괴
  function extendSword(runs){
    const result = new Set();
    for(const run of runs){
      if(run.axis==='row'){
        for(let c=0;c<COLS;c++){ const id=board[run.row][c]; if(id) result.add(id); }
      } else {
        for(let r=0;r<ROWS;r++){ const id=board[r][run.col]; if(id) result.add(id); }
      }
    }
    return result;
  }

  // 전기톱: 매치 중심을 지나는 가로 한 줄 + 세로 한 줄을 모두 베어 십자(+) 모양으로 파괴
  function extendChainsaw(runs){
    const result = new Set();
    for(const run of runs){
      const mid = Math.floor((run.start+run.end)/2);
      if(run.axis==='row'){
        for(let c=0;c<COLS;c++){ const id=board[run.row][c]; if(id) result.add(id); }
        for(let r=0;r<ROWS;r++){ const id=board[r][mid]; if(id) result.add(id); }
      } else {
        for(let r=0;r<ROWS;r++){ const id=board[r][run.col]; if(id) result.add(id); }
        for(let c=0;c<COLS;c++){ const id=board[mid][c]; if(id) result.add(id); }
      }
    }
    return result;
  }

  function attemptSwap(idA, idB){
    const a = blocks[idA], b = blocks[idB];
    if(!a || !b || state!=='playing') return;

    doSwapData(a,b); // 우선 스왑을 시각적으로 보여준다

    setTimeout(()=>{
      const runs = combineRuns({row:a.row,col:a.col}, {row:b.row,col:b.col});

      if(runs.length===0){
        // 매치가 안 만들어졌으면 흔들고 원위치로 복귀
        a.el.classList.add('invalid-shake');
        b.el.classList.add('invalid-shake');
        sfxInvalidSwap();
        setTimeout(()=>{
          a.el.classList.remove('invalid-shake');
          b.el.classList.remove('invalid-shake');
          doSwapData(a,b);
        }, 380);
        return;
      }

      const baseSet = baseMatchFromRuns(runs);
      const weapon = currentWeapon();
      let finalSet = baseSet;
      if(weapon.id === 'sword')    finalSet = new Set([...baseSet, ...extendSword(runs)]);
      if(weapon.id === 'chainsaw') finalSet = new Set([...baseSet, ...extendChainsaw(runs)]);

      destroyAndCascade(finalSet, weapon.scoreMul, 0);
    }, 260);
  }

  function blockCenter(b){
    return { x: b.col*cellSize + cellSize/2, y: b.row*cellSize + cellSize/2 };
  }

  /* ---------------- 파티클 ---------------- */
  function spawnParticles(centerPoint, kind, count){
    for(let i=0;i<count;i++){
      const p = document.createElement('span');
      p.className = 'particle ' + kind;
      const angle = Math.random()*Math.PI*2;
      const dist = 36 + Math.random()*50;
      const midDist = dist*0.5;
      const tx = Math.cos(angle)*dist;
      const ty = Math.sin(angle)*dist + 22;
      const txMid = Math.cos(angle)*midDist;
      const tyMid = Math.sin(angle)*midDist - 20;
      const scale = 0.75 + Math.random()*0.9;
      const rot = 360 + Math.random()*560;
      p.style.setProperty('--tx', tx.toFixed(1)+'px');
      p.style.setProperty('--ty', ty.toFixed(1)+'px');
      p.style.setProperty('--tx-mid', txMid.toFixed(1)+'px');
      p.style.setProperty('--ty-mid', tyMid.toFixed(1)+'px');
      p.style.setProperty('--scale', scale.toFixed(2));
      p.style.setProperty('--rot', rot.toFixed(0)+'deg');
      p.style.left = centerPoint.x + 'px';
      p.style.top = centerPoint.y + 'px';
      particleLayer.appendChild(p);
      p.addEventListener('animationend', ()=>p.remove());
    }
    spawnShockwave(centerPoint, kind);
  }

  function spawnShockwave(centerPoint, kind){
    const ring = document.createElement('span');
    ring.className = 'shockwave ' + kind;
    ring.style.left = centerPoint.x + 'px';
    ring.style.top = centerPoint.y + 'px';
    particleLayer.appendChild(ring);
    ring.addEventListener('animationend', ()=>ring.remove());
  }

  /* ---------------- 공주 피해 처리 (게임오버/Power감소 대신 화면을 잠깐 가림) ---------------- */
  function triggerPrincessHurtPenalty(){
    inputLocked = true;
    timePower = Math.max(0, timePower - PRINCESS_HIT_PENALTY);
    renderTimer();
    princessHurtOverlay.classList.add('show');
    showGuide(GUIDE_MESSAGES.hurt, {priority:'high'});
    sfxPrincessHurt();
    setTimeout(()=>{
      princessHurtOverlay.classList.remove('show');
      inputLocked = false;
    }, PRINCESS_HURT_LOCK_MS);
  }

  /* ---------------- 파괴 -> 낙하 -> 연쇄(콤보) ---------------- */
  function destroyAndCascade(idsSet, scoreMulTotal, cascadeDepth, particleKindOverride, chainTainted){
    const ids = [...idsSet].filter(id=>blocks[id]);
    if(ids.length===0){ checkPrincessAtBottom(); return; }

    const hasPrincess = ids.some(id=>blocks[id].type==='princess');
    // 이번 파괴에 공주가 포함되었거나, 앞서 이어진 연쇄(콤보) 중 공주가 다친 적이 있다면
    // 이번 턴은 물론 이어지는 연쇄 전체에서 Power 회복 보상을 주지 않는다.
    const restoreBlocked = hasPrincess || !!chainTainted;

    let gained = Math.round(ids.length * 10 * scoreMulTotal);
    if(ids.length>=5) gained += 25;
    if(ids.length>=8) gained += 40;
    score += gained;

    if(hasPrincess){
      // 공주가 다친 파괴는 Power를 회복시키지 않고, 페널티(감소)만 적용
      triggerPrincessHurtPenalty();
    } else if(!restoreBlocked){
      // 콤보(연쇄)일수록 Power를 더 많이 회복 + 화려한 콤보 이펙트
      const comboNum = cascadeDepth + 1;
      const comboMul = 1 + cascadeDepth * 0.6;
      const restoreAmount = ids.length * TIME_RESTORE_PER_BLOCK * comboMul;
      timePower = Math.min(TIME_MAX, timePower + restoreAmount);
      renderTimer();

      if(cascadeDepth>0){
        showComboPopup(comboNum);
        showGuide(comboNum+' 콤보! Power가 팍팍 채워져요 ⚡', {priority:'low'});
        sfxCombo(comboNum);
      }
    } else if(cascadeDepth>0){
      // 공주 피해로 오염된 연쇄: 회복은 없지만 콤보 연출만 보여준다
      showComboPopup(cascadeDepth+1);
      sfxCombo(cascadeDepth+1);
    }

    updateHud();
    updateLevelAndWeapons();

    const particleKind = particleKindOverride || (cascadeDepth>0 ? 'bone' : (currentWeapon().id==='chainsaw' ? 'spark' : 'bone'));
    const isBurn = particleKind === 'fire';

    // 무기별 타격 효과음 (연쇄 콤보는 무기음 대신 가벼운 파열음)
    if(cascadeDepth===0){
      const weaponSfxId = particleKindOverride==='fire' ? 'flamethrower' : currentWeaponId;
      if(weaponSfxId==='scythe') sfxScythe();
      else if(weaponSfxId==='sword') sfxSword();
      else if(weaponSfxId==='chainsaw') sfxChainsaw();
      else if(weaponSfxId==='flamethrower') sfxFlamethrower();
    } else {
      sfxCascadeBreak();
    }

    // 파괴되는 몬스터 종류별 비명 소리 (같은 종류는 한 번만, 살짝 시차를 둬서 자연스럽게)
    const screamTypes = new Set();
    ids.forEach(id=>{ const b=blocks[id]; if(b && b.type!=='princess') screamTypes.add(b.type); });
    let screamIdx = 0;
    screamTypes.forEach(t=>{
      const fn = SCREAM_BY_TYPE[t];
      if(fn){ const delayMs = screamIdx*70; setTimeout(fn, delayMs); }
      screamIdx++;
    });

    for(const id of ids){
      const b = blocks[id]; if(!b) continue;
      const c = blockCenter(b);
      if(isBurn){
        // 화염방사기: 불타오르다가 재가 되어 흩날리는 연출
        spawnParticles(c, 'fire', 10);
        spawnParticles(c, 'ash', 10);
        b.el.classList.add('burning');
      } else {
        spawnParticles(c, particleKind, particleKind==='spark' ? 13 : 11);
        b.el.classList.add('destroying');
      }
    }

    const removeDelay = isBurn ? 640 : 210;
    setTimeout(()=>{
      for(const id of ids){
        const b = blocks[id]; if(!b) continue;
        board[b.row][b.col] = null;
        b.el.remove();
        delete blocks[id];
      }
      applyGravityAndRefill();

      setTimeout(()=>{
        if(state!=='playing') return;
        const nextMatches = scanAllMatches();
        if(nextMatches.size>0){
          destroyAndCascade(nextMatches, Math.min(2.2, 1 + (cascadeDepth+1)*0.3), cascadeDepth+1, undefined, restoreBlocked);
        } else {
          checkPrincessAtBottom();
        }
      }, 340);
    }, removeDelay);
  }

  // 콤보 단계별 라벨/색상
  function comboLabel(n){
    if(n>=6) return { text:n+' COMBO!!', sub:'🤯 믿을 수 없어요!!', color:'#ff5fae' };
    if(n>=5) return { text:n+' COMBO!',  sub:'🔥 굉장해요!',       color:'#ff7a2e' };
    if(n>=4) return { text:n+' COMBO!',  sub:'⚡ 대박이에요!',     color:'#ffcf3b' };
    if(n>=3) return { text:n+' COMBO!',  sub:'✨ 좋아요!',         color:'#9ce66b' };
    return   { text:n+' COMBO!',         sub:'',                   color:'#8fd0ff' };
  }

  function showComboPopup(comboNum){
    const info = comboLabel(comboNum);
    const el = document.createElement('div');
    el.className = 'combo-popup';
    el.style.color = info.color;
    el.style.fontSize = (26 + Math.min(comboNum,6)*4) + 'px';
    el.innerHTML = info.text + (info.sub ? '<div class="combo-sub">'+info.sub+'</div>' : '');
    boardWrap.appendChild(el);
    requestAnimationFrame(()=> el.classList.add('show'));
    el.addEventListener('animationend', ()=> el.remove());

    if(comboNum>=4){
      boardWrap.classList.remove('shake');
      void boardWrap.offsetHeight;
      boardWrap.classList.add('shake');
    }
  }

  function scanAllMatches(){
    const found = new Set();
    for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
      if(!board[r][c]) continue;
      findRunsAt(r,c).forEach(run=> runCells(run).forEach(id=>{ if(id) found.add(id); }));
    }
    return found;
  }

  function applyGravityAndRefill(){
    for(let c=0;c<COLS;c++){
      const stack = [];
      for(let r=0;r<ROWS;r++){
        const id = board[r][c];
        if(id && blocks[id]) stack.push(id);
        board[r][c] = null;
      }
      const emptyCount = ROWS - stack.length;
      for(let i=0;i<stack.length;i++){
        const id = stack[i];
        const newRow = emptyCount + i;
        const b = blocks[id];
        b.row = newRow; b.col = c;
        board[newRow][c] = id;
        positionBlock(b);
      }
      for(let i=0;i<emptyCount;i++){
        const newRow = i;
        const type = randomBlockType();
        const spawnAboveOffset = emptyCount - i;
        const b = createBlock(type, newRow, c, spawnAboveOffset);
        board[newRow][c] = b.id;
        if(type==='princess'){ showGuide(GUIDE_MESSAGES.princessSpawn, {priority:'low'}); sfxPrincessSpawn(); }
      }
    }
  }

  /* ---------------- 화염방사기 (일회성 스킬 + 쿨다운) ---------------- */
  function triggerFlamethrower(centerBlock){
    const r0=centerBlock.row, c0=centerBlock.col;
    const ids = new Set();
    for(let r=r0-FLAME_RADIUS; r<=r0+FLAME_RADIUS; r++){
      for(let c=c0-FLAME_RADIUS; c<=c0+FLAME_RADIUS; c++){
        if(!inBounds(r,c)) continue;
        const id = board[r][c];
        // 공주 블록은 화염방사기의 방어막으로 보호되어 대상에서 제외됨
        if(id && blocks[id] && blocks[id].type!=='princess') ids.add(id);
      }
    }

    flamethrowerState.armed = false;
    boardWrap.classList.remove('targeting');
    flamethrowerState.cooldownLeft = FLAME_COOLDOWN_MS;
    lastCooldownSecRendered = -1;
    renderWeaponBar();

    if(ids.size===0){ showToast('🔥 근처에 태울 몬스터가 없어요...'); return; }
    showToast('🔥 화염방사기 발사! ('+ids.size+'마리 제거)');
    noiseBurst({dur:0.45, freq:130, freqEnd:50, gain:0.4, filterType:'lowpass'});
    destroyAndCascade(ids, 1.3, 0, 'fire');
  }

  /* ---------------- 공주 구출 / 게임오버 ---------------- */
  function checkPrincessAtBottom(){
    for(let c=0;c<COLS;c++){
      const id = board[ROWS-1][c];
      if(id && blocks[id] && blocks[id].type==='princess') rescuePrincess(blocks[id]);
    }
  }

  function rescuePrincess(b){
    score += RESCUE_BONUS;
    timePower = TIME_MAX; // 공주 구출 보상: Power를 완전히 채워줌
    powerFreezeUntil = Date.now() + RESCUE_KISS_VISIBLE_MS + RESCUE_POWER_FREEZE_EXTRA_MS;
    renderTimer();
    updateHud();
    showToast('👑 공주님 구출 성공! +'+RESCUE_BONUS+' / Power 완충!');
    showGuide(GUIDE_MESSAGES.rescued, {priority:'high'});
    sfxPrincessRescue();

    const c = blockCenter(b);
    // 구출은 어려운 만큼 확실히 화려하게: 큰 파티클 + 보드 전체 골드 플래시 + 공주 등장 연출
    spawnParticles(c, 'gold', 34);
    spawnShockwave(c, 'gold');
    rescueFlashEl.classList.remove('show'); void rescueFlashEl.offsetHeight;
    rescueFlashEl.classList.add('show');
    b.el.classList.add('rescued');

    inputLocked = true;
    rescueKissOverlay.classList.add('show');
    setTimeout(()=>{
      rescueKissOverlay.classList.remove('show');
      inputLocked = false;
    }, RESCUE_KISS_VISIBLE_MS);

    setTimeout(()=>{
      board[b.row][b.col] = null;
      b.el.remove();
      delete blocks[b.id];
      applyGravityAndRefill();

      // 구출로 인한 낙하 이후에도 3매치가 그대로 남아있지 않도록 다시 검사한다
      setTimeout(()=>{
        if(state!=='playing') return;
        const matches = scanAllMatches();
        if(matches.size>0){
          destroyAndCascade(matches, 1, 0);
        } else {
          checkPrincessAtBottom();
        }
      }, 340);
    }, 420);
  }

  function triggerGameOver(reason){
    if(state !== 'playing') return;
    state = 'gameover';
    cancelAnimationFrame(rafId);
    stopIdleTaunt();
    stopMusic();
    sfxGameOver();
    playMusic(GAMEOVER_TRACK, false);

    let reasonText = '시간이 다 되어버렸어요... 몬스터들이 너무 많았네요.';
    if(reason==='princess_drain') reasonText = '공주님을 자꾸 다치게 해서 Power가 다 떨어졌어요...';
    $('#gameover-reason').textContent = reasonText;
    $('#final-score').textContent = score;

    const result = submitScore(score, level);
    renderRanking(result);

    switchScreen('gameover');
  }

  function renderRanking(result){
    const listEl = $('#ranking-list');
    listEl.innerHTML = '';
    result.top.forEach((entry, idx)=>{
      const li = document.createElement('li');
      const isMine = entry === result.entry;
      li.className = 'rank-row' + (isMine ? ' mine' : '');
      li.innerHTML = '<span class="rank-num">'+(idx+1)+'위</span><span class="rank-score">'+entry.score+'점 <span class="rank-level">(Lv.'+(entry.level||1)+')</span></span>';
      listEl.appendChild(li);
    });
    const myRankEl = $('#my-rank');
    if(result.rank <= result.top.length){
      myRankEl.textContent = '이번 판이 상위 '+result.rank+'위에 올랐어요! 🎉';
    } else {
      myRankEl.textContent = '이번 판 순위: '+result.rank+'위 (총 '+result.totalCount+'판 중)';
    }
  }

  /* ---------------- 레벨 / HUD ---------------- */
  function updateLevelAndWeapons(){
    const newLevel = 1 + Math.floor(score / LEVEL_UP_SCORE);
    if(newLevel > level){
      level = newLevel;
      const justUnlocked = WEAPONS.find(w=>w.unlockLevel===level);
      if(justUnlocked){
        playWeaponUnlockAnimation(justUnlocked);
      } else {
        renderWeaponBar();
        showToast('🎉 레벨 '+level+' 달성! 몬스터가 더 빨라져요');
      }
    }
    updateHud();
  }

  // 새 무기 해금 시: 화면 중앙에 큰 아이콘이 나타났다가 무기 슬롯 자리로 날아가서 쏙 들어가는 연출
  function playWeaponUnlockAnimation(weapon){
    renderWeaponBar(); // 슬롯을 먼저 그려서 목표 좌표를 계산할 수 있게 함
    const slotEl = weaponBarEl.querySelector('[data-weapon-id="'+weapon.id+'"]');
    showToast('🎉 레벨 '+level+'! 새 무기 해금: '+weapon.name);
    showGuide(GUIDE_MESSAGES.weaponUnlocked(weapon.name), {priority:'high'});
    sfxWeaponUnlock();
    if(!slotEl) return;

    const targetRect = slotEl.getBoundingClientRect();
    const gameRect = gameScreen.getBoundingClientRect();
    const startX = gameRect.left + gameRect.width/2;
    const startY = gameRect.top + gameRect.height*0.4;

    const flyEl = document.createElement('div');
    flyEl.className = 'weapon-unlock-fly';
    flyEl.textContent = weapon.icon;
    flyEl.style.left = startX + 'px';
    flyEl.style.top = startY + 'px';
    document.body.appendChild(flyEl);

    requestAnimationFrame(()=>{
      const endX = targetRect.left + targetRect.width/2;
      const endY = targetRect.top + targetRect.height/2;
      flyEl.style.setProperty('--dx', (endX-startX)+'px');
      flyEl.style.setProperty('--dy', (endY-startY)+'px');
      flyEl.classList.add('fly');
    });

    setTimeout(()=>{
      flyEl.remove();
      slotEl.classList.add('just-unlocked');
      setTimeout(()=>slotEl.classList.remove('just-unlocked'), 650);
    }, 980);
  }

  function updateHud(){ hudLevel.textContent = level; hudScore.textContent = score; }

  /* ---------------- 타이머(난이도) + 화염방사기 쿨다운 루프 ---------------- */
  function tickLoop(ts){
    if(state !== 'playing') return;
    if(lastFrameTs==null) lastFrameTs = ts;
    const dt = Math.min(0.05, (ts - lastFrameTs)/1000);
    lastFrameTs = ts;

    const depletionRate = TIME_BASE_DEPLETION + (level-1)*TIME_DEPLETION_PER_LEVEL;
    if(Date.now() >= powerFreezeUntil){
      timePower -= depletionRate * dt;
    }
    if(timePower <= 0){
      timePower = 0; renderTimer(); triggerGameOver('timeout'); return;
    }
    renderTimer();

    // Power가 부족할 때 한 번만 경고 (다시 여유로워지면 재무장)
    if(timePower < 22 && !lowPowerWarned){
      lowPowerWarned = true;
      showGuide(GUIDE_MESSAGES.lowPower, {priority:'high'});
    } else if(timePower > 40){
      lowPowerWarned = false;
    }

    if(flamethrowerState.cooldownLeft>0){
      flamethrowerState.cooldownLeft = Math.max(0, flamethrowerState.cooldownLeft - dt*1000);
      const sec = Math.ceil(flamethrowerState.cooldownLeft/1000);
      if(sec !== lastCooldownSecRendered){
        lastCooldownSecRendered = sec;
        renderWeaponBar();
      }
      if(flamethrowerState.cooldownLeft<=0 && prevFlameCooldownLeft>0){
        showGuide(GUIDE_MESSAGES.flamethrowerReady, {priority:'low'});
      }
    }
    prevFlameCooldownLeft = flamethrowerState.cooldownLeft;

    rafId = requestAnimationFrame(tickLoop);
  }

  function renderTimer(){
    const pct = Math.max(0, Math.min(100, timePower));
    timerFill.style.width = pct + '%';
    if(pct < 20) timerFill.style.background = 'linear-gradient(90deg,#c23553,#ff6b7a)';
    else if(pct < 50) timerFill.style.background = 'linear-gradient(90deg,#e0a33b,#ffd76a)';
    else timerFill.style.background = 'linear-gradient(90deg, var(--accent-glow), var(--accent-glow-2))';
  }

  /* ---------------- 무기 바 ---------------- */
  function renderWeaponBar(){
    weaponBarEl.innerHTML = '';
    for(const w of WEAPONS){
      const unlocked = w.unlockLevel <= level;
      const slot = document.createElement('div');
      let cls = 'weapon-slot';
      if(!unlocked) cls += ' locked';
      if(w.id!=='flamethrower' && w.id===currentWeaponId) cls += ' active';
      if(w.id==='flamethrower' && unlocked){
        if(flamethrowerState.armed) cls += ' arming';
        else if(flamethrowerState.cooldownLeft>0) cls += ' cooling';
      }
      slot.className = cls;
      slot.dataset.weaponId = w.id;

      let nameHtml;
      if(w.id==='flamethrower' && unlocked && flamethrowerState.cooldownLeft>0){
        nameHtml = Math.ceil(flamethrowerState.cooldownLeft/1000)+'초';
      } else {
        nameHtml = w.name;
      }
      slot.innerHTML = '<span class="icon">'+w.icon+'</span><span class="name">'+nameHtml+'</span>' + (unlocked? '' : '<span class="lock">🔒</span>');

      if(unlocked){
        if(w.id==='flamethrower'){
          if(flamethrowerState.cooldownLeft<=0){
            slot.addEventListener('click', ()=>{
              sfxClick();
              flamethrowerState.armed = !flamethrowerState.armed;
              boardWrap.classList.toggle('targeting', flamethrowerState.armed);
              renderWeaponBar();
              if(flamethrowerState.armed) showToast('🔥 조준 중... 폭파할 몬스터를 탭하세요');
            });
          }
        } else {
          slot.addEventListener('click', ()=>{ sfxClick(); currentWeaponId = w.id; renderWeaponBar(); });
        }
      }
      weaponBarEl.appendChild(slot);
    }
    updateWeaponDescription();
  }

  // 현재 장착(또는 조준 중)인 무기의 설명을 하단 안내 문구로 표시
  function updateWeaponDescription(){
    let id = currentWeaponId;
    if(flamethrowerState.armed || flamethrowerState.cooldownLeft>0) id = 'flamethrower';
    const w = WEAPONS.find(x=>x.id===id);
    if(!w) return;
    weaponDescEl.innerHTML = '<b>'+w.icon+' '+w.name+'</b> — ' + WEAPON_DESC[id];
  }

  /* ---------------- 화면 전환 / 초기화 ---------------- */
  function switchScreen(name){
    startScreen.classList.toggle('active', name==='start');
    gameoverScreen.classList.toggle('active', name==='gameover');
    gameScreen.classList.toggle('active', name==='playing');
  }

  function startGame(){
    score=0; level=1; timePower=TIME_MAX; currentWeaponId='scythe';
    flamethrowerState = { armed:false, cooldownLeft:0 };
    lastCooldownSecRendered = -1;
    inputLocked = false;
    powerFreezeUntil = 0;
    guideLockUntil = 0;
    lowPowerWarned = false;
    prevFlameCooldownLeft = 0;
    boardWrap.classList.remove('targeting');
    princessHurtOverlay.classList.remove('show');
    rescueKissOverlay.classList.remove('show');
    rescueFlashEl.classList.remove('show');
    clearBoardDom();
    state='playing';
    switchScreen('playing');
    updateHud();
    renderWeaponBar();
    renderTimer();

    ensureAudio();
    stopMusic();
    playMusic(GAMEPLAY_TRACK, true);
    sfxTauntCackle();
    scheduleIdleTaunt();

    showGuide(GUIDE_MESSAGES.start, {priority:'high'});
    setTimeout(()=>{ if(state==='playing') showGuide(GUIDE_MESSAGES.howto, {priority:'low'}); }, 3200);

    requestAnimationFrame(()=>{
      recalcCellSize();
      buildInitialBoard();
      lastFrameTs = null;
      rafId = requestAnimationFrame(tickLoop);
    });
  }

  function goHome(){
    state='start';
    stopIdleTaunt();
    stopMusic();
    playMusic(TITLE_TRACK, true);
    switchScreen('start');
  }

  $('#btn-start').addEventListener('click', ()=>{ sfxClick(); startGame(); });
  $('#btn-restart').addEventListener('click', ()=>{ sfxClick(); startGame(); });
  $('#btn-home').addEventListener('click', ()=>{ sfxClick(); goHome(); });

  boardWrap.addEventListener('pointerdown', onPointerDown);
  window.addEventListener('pointermove', onPointerMove);
  window.addEventListener('pointerup', onPointerUp);
  window.addEventListener('pointercancel', onPointerUp);

  let resizeTimer=null;
  window.addEventListener('resize', ()=>{
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(recalcCellSize, 120);
  });

})();
</script>
</body>
</html>
